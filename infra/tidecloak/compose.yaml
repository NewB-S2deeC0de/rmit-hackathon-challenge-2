name: entruth-tidecloak

services:
  tidecloak:
    image: tideorg/tidecloak-dev:latest
    container_name: entruth-tidecloak
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${ENTRUTH_TIDE_ADMIN_USERNAME:?Set in infra/tidecloak/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ENTRUTH_TIDE_ADMIN_PASSWORD:?Set in infra/tidecloak/.env}
    volumes:
      - ./data:/opt/keycloak/data/h2
